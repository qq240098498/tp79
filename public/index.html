<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多语言文案管理平台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>多语言文案管理平台</h1>
      <p class="subtitle">登记要支持的语言，按模块维护文案，逐条填上各个语言的译文</p>
    </div>
    <div class="topbar-right">
      <label class="operator" data-field="operator">当前操作者
        <input id="operator" placeholder="填上你的名字" maxlength="40">
      </label>
      <div class="health" id="health">连接中…</div>
    </div>
  </header>

  <div class="notice hidden" id="notice"></div>

  <main>
    <section class="panel">
      <div class="panel-head">
        <h2>语言</h2>
        <div class="panel-tip">默认语言有且只有一种，停用的语言仍然保留已填译文，在编辑表单里会标出来</div>
      </div>
      <div class="table-wrap">
        <table class="grid">
          <thead>
            <tr>
              <th>语言代码</th>
              <th>名称</th>
              <th>默认语言</th>
              <th>启用状态</th>
              <th>已填译文</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="language-body"></tbody>
        </table>
      </div>
      <p class="empty-tip hidden" id="language-empty">还没有登记任何语言</p>

      <form class="inline-form" id="language-form" autocomplete="off">
        <h3>新增语言</h3>
        <label data-field="code">语言代码<input id="language-code" placeholder="例如 ko-KR" maxlength="20"></label>
        <label data-field="name">语言名称<input id="language-name" placeholder="例如 韩语" maxlength="40"></label>
        <label class="check" data-field="enabled"><input type="checkbox" id="language-enabled" checked> 启用</label>
        <label class="check" data-field="isDefault"><input type="checkbox" id="language-default"> 设为默认语言</label>
        <button type="submit">新增语言</button>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>文案</h2>
        <div class="filters">
          <select id="filter-module"><option value="">全部模块</option></select>
          <input id="filter-keyword" placeholder="搜索文案键或译文" maxlength="60">
          <button type="button" id="filter-apply">筛选</button>
          <button type="button" id="filter-reset" class="ghost">重置</button>
          <button type="button" id="entry-refresh" class="ghost">刷新</button>
          <button type="button" id="trash-open" class="ghost">回收站<span class="badge hidden" id="trash-count">0</span></button>
          <button type="button" id="entry-new">新建文案</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="grid">
          <thead>
            <tr id="entry-head-row"></tr>
          </thead>
          <tbody id="entry-body"></tbody>
        </table>
      </div>
      <p class="empty-tip hidden" id="entry-empty">当前筛选条件下没有文案</p>

      <form class="entry-form hidden" id="entry-form" autocomplete="off">
        <h3 id="entry-form-title">新建文案</h3>
        <div class="form-row">
          <label data-field="module">模块<input id="entry-module" placeholder="例如 home" maxlength="30"></label>
          <label data-field="key">文案键<input id="entry-key" placeholder="例如 home.banner.title" maxlength="120"></label>
        </div>
        <div class="form-row translations" id="entry-translations"></div>
        <label class="full" data-field="note">备注<input id="entry-note" placeholder="这条文案出现的页面位置" maxlength="200"></label>
        <div class="form-actions">
          <button type="submit">保存</button>
          <button type="button" id="entry-cancel" class="ghost">取消</button>
        </div>
      </form>
    </section>
  </main>

  <!-- 回收站：只读，只能查看与恢复；展示原模块/键、全部译文、删除人与时间、剩余保留时间 -->
  <div class="overlay hidden" id="trash-overlay">
    <div class="dialog trash-dialog">
      <div class="dialog-head">
        <div>
          <h2>回收站</h2>
          <p class="panel-tip">删除的文案会先移入回收站，保留 30 天，到期自动清除；回收站内容只读，仅支持恢复，不能编辑</p>
        </div>
        <div class="filters">
          <select id="trash-filter-module"><option value="">全部模块</option></select>
          <input id="trash-filter-keyword" placeholder="搜索文案键或译文" maxlength="60">
          <button type="button" id="trash-filter-apply">筛选</button>
          <button type="button" id="trash-filter-reset" class="ghost">重置</button>
          <button type="button" id="trash-refresh" class="ghost">刷新</button>
          <button type="button" id="trash-close" class="ghost">关闭</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="grid trash-grid">
          <thead>
            <tr>
              <th>原模块</th>
              <th>原文案键</th>
              <th>全部译文</th>
              <th>删除信息</th>
              <th>距离自动清除</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="trash-body"></tbody>
        </table>
      </div>
      <p class="empty-tip hidden" id="trash-empty">回收站是空的，删除的文案会先出现在这里</p>
      <p class="trash-status" id="trash-status"></p>
    </div>
  </div>

  <!-- 恢复冲突：原模块与键已被新文案占用时，当场指出冲突，让操作者换一个键再恢复或放弃 -->
  <div class="overlay hidden" id="restore-overlay">
    <div class="dialog restore-dialog">
      <div class="dialog-head">
        <h2>恢复时发现键冲突</h2>
      </div>
      <div id="restore-conflict-info" class="conflict-info"></div>
      <form id="restore-form" autocomplete="off">
        <div class="form-row">
          <label data-field="restore.module">恢复到模块<input id="restore-module" maxlength="30"></label>
          <label data-field="restore.key">换一个文案键<input id="restore-key" maxlength="120"></label>
        </div>
        <p class="panel-tip">换成新键后恢复，原文案键与删除记录仍会保留；也可以放弃这次恢复</p>
        <p class="trash-status" id="restore-status"></p>
        <div class="form-actions">
          <button type="submit" id="restore-confirm">换这个键恢复</button>
          <button type="button" id="restore-cancel" class="ghost">放弃恢复</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
